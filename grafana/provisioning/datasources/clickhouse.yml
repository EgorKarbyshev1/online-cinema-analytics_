apiVersion: 1
datasources:
  - name: Cinema ClickHouse
    uid: cinema-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: default
      username: cinema
    secureJsonData:
      password: cinema-local
